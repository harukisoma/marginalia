<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marginalia — ChatGPT接続</title><style>
:root{font-family:system-ui,sans-serif;color:#243b32;background:#f8f7f3}*{box-sizing:border-box}body{margin:0;padding:32px 20px}main{max-width:480px;margin:8vh auto;padding:28px;background:#fffefa;border:1px solid #dce0d8;border-radius:20px}h1{font-size:24px;margin:12px 0}p{line-height:1.8;font-size:14px}.brand{letter-spacing:2px;font-size:12px}button,a{font:inherit}button{width:100%;min-height:48px;border:0;border-radius:10px;background:#304f42;color:white;font-weight:600;padding:12px;cursor:pointer}button:disabled{opacity:.5}#status{padding:14px;background:#edf1e9;border-radius:10px}small{display:block;color:#66756c;line-height:1.7;margin-top:18px}a{color:inherit}#error{color:#963e2b;white-space:pre-wrap}#manual{margin-top:16px}code{overflow-wrap:anywhere}input{width:100%;font:inherit;padding:12px;border:1px solid #ccd5ca;border-radius:8px}
</style></head><body><main><span class="brand">MARGINALIA</span><h1>ChatGPTに接続</h1><p>このMacで一度ログインすると、MarginaliaからChatGPTの契約枠でAIを使えます。</p><p id="status" role="status">接続を確認しています…</p><p id="error" role="alert"></p><button id="connect" hidden>Continue with ChatGPT</button><button id="finish" hidden>Marginaliaに接続する</button><p id="done" hidden>接続が完了しました。Marginaliaの画面へ戻ってください。</p><small>iPhoneでも使う場合は、Marginaliaのクラウド同期にログインしておいてください。AIの利用中はこのMacを起動しておきます。日記・リーフの本文は、この接続画面では読み取りません。</small><details id="manual"><summary>自動で戻れない場合</summary><p>Marginaliaの「詳細設定」で使用する接続コードです。ほかの人に共有しないでください。</p><button id="copy">接続コードをコピー</button></details></main><script src="/auth/setup.js"></script></body></html>
